plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly 'org.ow2.asm:asm:9.8'
    compileOnly 'org.ow2.asm:asm-tree:9.8'
    compileOnly 'org.ow2.asm:asm-commons:9.8'
}

tasks.named('jar') {
    archiveBaseName.set('methods_injector_agent')
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Premain-Class': 'ca.dnamobile.droidbridgelauncher.agent.StartInjectors',
            'Agent-Class': 'ca.dnamobile.droidbridgelauncher.agent.StartInjectors',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('copyAgentToAssets', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(rootProject.file('app/src/main/assets/components/methods_injector_agent'))
    rename { 'methods_injector_agent.jar' }
}
