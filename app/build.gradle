plugins {
    id 'com.android.application'
}

def launcherPackage = 'ca.dnamobile.droidbridgelauncher'
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def buildConfigString = { String value ->
    '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace launcherPackage
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId launcherPackage
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        buildConfigField 'String', 'MICROSOFT_CLIENT_ID', buildConfigString(localProperties.getProperty('MICROSOFT_CLIENT_ID', project.findProperty('MICROSOFT_CLIENT_ID') ?: 'CHANGE_ME'))
        buildConfigField 'String', 'MICROSOFT_REDIRECT_URI', buildConfigString(localProperties.getProperty('MICROSOFT_REDIRECT_URI', project.findProperty('MICROSOFT_REDIRECT_URI') ?: 'droidbridge://auth'))
        buildConfigField 'String', 'MICROSOFT_SCOPE', buildConfigString(localProperties.getProperty('MICROSOFT_SCOPE', project.findProperty('MICROSOFT_SCOPE') ?: 'XboxLive.signin offline_access'))
        buildConfigField 'String', 'GAME_DIRECTORY_NAME', buildConfigString('.minecraft')
        buildConfigField 'String', 'CURSEFORGE_API_KEY', buildConfigString(localProperties.getProperty('CURSEFORGE_API_KEY', project.findProperty('CURSEFORGE_API_KEY') ?: ''))
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false; shrinkResources false }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { prefab true; buildConfig true; viewBinding true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        ndkBuild { path file('src/main/jni/Android.mk') }
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    packaging {
        jniLibs { useLegacyPackaging true; pickFirsts += ['**/libbytehook.so'] }
        resources {
            excludes += ['META-INF/{AL2.0,LGPL2.1}', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }
}

dependencies {
    implementation project(':nativeglfw')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'net.openid:appauth:0.11.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.bytedance:bytehook:1.0.10'
    implementation 'androidx.multidex:multidex:2.0.1'
}
